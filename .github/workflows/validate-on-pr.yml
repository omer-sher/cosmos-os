name: Validate Cosmos

# Runs typecheck + build + `npm run validate` on every PR (and on push to main) to make
# sure Cosmos internal consistency never regresses. Designed to be
# marked as a REQUIRED status check in repo branch protection — once
# you do that in the UI (Settings → Branches → main → Add rule), no
# PR can merge without this passing, including auto-generated
# cosmos-sync PRs from the nightly cron.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout cosmos
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (typecheck + vite)
        run: npm run build

      - name: Typecheck drift-sync
        run: npx tsc -p drift-sync --noEmit

      - name: Validate Cosmos
        run: npm run validate
