<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="nebula1" cx="20%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#1b1330" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#050608" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula2" cx="85%" cy="100%" r="70%">
      <stop offset="0%" stop-color="#0a2030" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#050608" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-magenta" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e879f9" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#e879f9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-red" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f55b5b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f55b5b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="comet-tail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5b731" stop-opacity="0"/>
      <stop offset="100%" stop-color="#f5b731" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="55%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f5b731"/>
    </linearGradient>
  </defs>

  <!-- deep space -->
  <rect width="1280" height="340" fill="#050608"/>
  <rect width="1280" height="340" fill="url(#nebula1)"/>
  <rect width="1280" height="340" fill="url(#nebula2)"/>

  <!-- starfield -->
  <g fill="#ffffff">
    <circle cx="63" cy="52" r="1.1" opacity="0.7"/><circle cx="142" cy="210" r="0.8" opacity="0.4"/>
    <circle cx="238" cy="88" r="1.3" opacity="0.8"/><circle cx="311" cy="281" r="0.9" opacity="0.45"/>
