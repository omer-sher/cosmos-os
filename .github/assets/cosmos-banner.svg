<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="nebula1" cx="20%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#1b1330" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#050608" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula2" cx="85%" cy="100%" r="70%">
      <stop offset="0%" stop-color="#0a2030" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#050608" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-magenta" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e879f9" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#e879f9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-red" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f55b5b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f55b5b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="comet-tail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5b731" stop-opacity="0"/>
      <stop offset="100%" stop-color="#f5b731" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="55%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f5b731"/>
    </linearGradient>
  </defs>

  <!-- deep space -->
  <rect width="1280" height="340" fill="#050608"/>
  <rect width="1280" height="340" fill="url(#nebula1)"/>
  <rect width="1280" height="340" fill="url(#nebula2)"/>

  <!-- starfield -->
  <g fill="#ffffff">
    <circle cx="63" cy="52" r="1.1" opacity="0.7"/><circle cx="142" cy="210" r="0.8" opacity="0.4"/>
    <circle cx="238" cy="88" r="1.3" opacity="0.8"/><circle cx="311" cy="281" r="0.9" opacity="0.45"/>
    <circle cx="418" cy="41" r="0.8" opacity="0.5"/><circle cx="392" cy="176" r="1.0" opacity="0.35"/>
    <circle cx="529" cy="262" r="1.2" opacity="0.6"/><circle cx="547" cy="97" r="0.7" opacity="0.4"/>
    <circle cx="678" cy="35" r="1.0" opacity="0.65"/><circle cx="641" cy="205" r="0.8" opacity="0.35"/>
    <circle cx="758" cy="300" r="1.1" opacity="0.55"/><circle cx="812" cy="141" r="0.7" opacity="0.45"/>
    <circle cx="887" cy="61" r="1.2" opacity="0.75"/><circle cx="934" cy="248" r="0.8" opacity="0.4"/>
    <circle cx="1013" cy="112" r="0.9" opacity="0.5"/><circle cx="1061" cy="24" r="1.1" opacity="0.6"/>
    <circle cx="1118" cy="296" r="0.9" opacity="0.45"/><circle cx="1177" cy="176" r="1.3" opacity="0.7"/>
    <circle cx="1236" cy="72" r="0.8" opacity="0.5"/><circle cx="96" cy="311" r="1.0" opacity="0.5"/>
    <circle cx="205" cy="167" r="0.7" opacity="0.35"/><circle cx="489" cy="24" r="0.9" opacity="0.55"/>
    <circle cx="726" cy="122" r="0.7" opacity="0.3"/><circle cx="972" cy="27" r="0.8" opacity="0.45"/>
    <circle cx="1225" cy="252" r="1.0" opacity="0.55"/><circle cx="27" cy="141" r="0.9" opacity="0.55"/>
  </g>
  <!-- one four-point sparkle -->
  <path d="M 1132 60 l 2.4 7.6 7.6 2.4 -7.6 2.4 -2.4 7.6 -2.4 -7.6 -7.6 -2.4 7.6 -2.4 Z" fill="#e6f6ff" opacity="0.9"/>

  <!-- ══ mini-map (right side) ══ -->

  <!-- edges under nodes -->
  <!-- storefront → orders (http, amber) : comet rides this one -->
  <path id="edge-http" d="M 812 246 C 880 210, 950 150, 1020 128" fill="none" stroke="#f5b731" stroke-opacity="0.5" stroke-width="1.6"/>
  <!-- orders → topic → realtime-hub (kafka, orange, dashed through the orbital) -->
  <path d="M 1063 118 C 1090 105, 1112 96, 1136 88" fill="none" stroke="#fb923c" stroke-opacity="0.55" stroke-width="1.4" stroke-dasharray="5 4"/>
  <path d="M 1160 82 C 1185 76, 1204 80, 1222 92" fill="none" stroke="#fb923c" stroke-opacity="0.55" stroke-width="1.4" stroke-dasharray="5 4"/>
  <!-- realtime-hub → storefront (ws, cyan) -->
  <path d="M 1222 120 C 1120 210, 950 260, 830 258" fill="none" stroke="#22d3ee" stroke-opacity="0.5" stroke-width="1.6"/>

  <!-- comet on the amber edge -->
  <g>
    <path d="M 920 172 C 950 156, 975 143, 1000 133 L 996 141 C 972 150, 950 162, 924 178 Z" fill="url(#comet-tail)"/>
    <circle cx="1002" cy="132" r="4.5" fill="#ffe9b0"/>
    <circle cx="1002" cy="132" r="9" fill="#f5b731" opacity="0.35"/>
  </g>

  <!-- topic orbital -->
  <g>
    <circle cx="1148" cy="85" r="13" fill="none" stroke="#fb923c" stroke-opacity="0.8" stroke-width="1.3" stroke-dasharray="3 3"/>
    <circle cx="1148" cy="85" r="4" fill="#fb923c"/>
    <text x="1148" y="63" text-anchor="middle" font-size="10" fill="#fb923c" opacity="0.85" font-family="ui-monospace, 'SF Mono', Menlo, monospace">orders.created</text>
  </g>

  <!-- service capsules -->
  <g>
    <ellipse cx="778" cy="246" rx="90" ry="46" fill="url(#glow-cyan)"/>
    <rect x="712" y="228" width="132" height="36" rx="18" fill="#0d1526" stroke="#22d3ee" stroke-width="1.4"/>
    <circle cx="734" cy="246" r="4" fill="#22d3ee"/>
    <text x="748" y="251" font-size="13.5" font-weight="600" fill="#d9f6fd">storefront</text>
  </g>
  <g>
    <ellipse cx="1042" cy="118" rx="80" ry="42" fill="url(#glow-red)"/>
    <rect x="988" y="100" width="108" height="36" rx="18" fill="#170e14" stroke="#f55b5b" stroke-width="1.4"/>
    <circle cx="1010" cy="118" r="4" fill="#f55b5b"/>
    <text x="1024" y="123" font-size="13.5" font-weight="600" fill="#ffdede">orders</text>
  </g>
  <g>
    <ellipse cx="1252" cy="106" rx="95" ry="48" fill="url(#glow-magenta)"/>
    <rect x="1186" y="88" width="132" height="36" rx="18" fill="#170d1c" stroke="#e879f9" stroke-width="1.4"/>
    <circle cx="1208" cy="106" r="4" fill="#e879f9"/>
    <text x="1222" y="111" font-size="13.5" font-weight="600" fill="#fbe3ff">realtime-hub</text>
    <circle cx="1310" cy="94" r="7" fill="#170d1c" stroke="#e879f9" stroke-width="1.2"/>
    <text x="1310" y="97.5" text-anchor="middle" font-size="10" font-weight="700" fill="#e879f9">+</text>
  </g>

  <!-- ══ wordmark (left side) ══ -->
  <text x="84" y="172" font-size="84" font-weight="700" letter-spacing="14" fill="url(#wordmark)">COSMOS</text>
  <text x="88" y="212" font-size="19" fill="#aab3bd" letter-spacing="1">a living map of your architecture</text>
  <g font-size="12.5" fill="#6d7680" font-family="ui-monospace, 'SF Mono', Menlo, monospace">
    <text x="88" y="252">services as stars · flows as comets · honesty as a nightly agent</text>
  </g>
</svg>
