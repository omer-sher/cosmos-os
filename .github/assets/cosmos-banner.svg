    <circle cx="1225" cy="252" r="1.0" opacity="0.55"/><circle cx="27" cy="141" r="0.9" opacity="0.55"/>
  </g>
  <!-- one four-point sparkle -->
  <path d="M 1132 60 l 2.4 7.6 7.6 2.4 -7.6 2.4 -2.4 7.6 -2.4 -7.6 -7.6 -2.4 7.6 -2.4 Z" fill="#e6f6ff" opacity="0.9"/>

  <!-- ══ mini-map (right side) ══ -->

  <!-- edges under nodes -->
  <!-- storefront → orders (http, amber) : comet rides this one -->
  <path id="edge-http" d="M 812 246 C 880 210, 950 150, 1020 128" fill="none" stroke="#f5b731" stroke-opacity="0.5" stroke-width="1.6"/>
  <!-- orders → topic → realtime-hub (kafka, orange, dashed through the orbital) -->
  <path d="M 1063 118 C 1090 105, 1112 96, 1136 88" fill="none" stroke="#fb923c" stroke-opacity="0.55" stroke-width="1.4" stroke-dasharray="5 4"/>
  <path d="M 1160 82 C 1185 76, 1204 80, 1222 92" fill="none" stroke="#fb923c" stroke-opacity="0.55" stroke-width="1.4" stroke-dasharray="5 4"/>
