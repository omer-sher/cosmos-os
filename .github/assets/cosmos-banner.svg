  <path d="M 1222 120 C 1120 210, 950 260, 830 258" fill="none" stroke="#22d3ee" stroke-opacity="0.5" stroke-width="1.6"/>

  <!-- comet on the amber edge -->
  <g>
    <path d="M 920 172 C 950 156, 975 143, 1000 133 L 996 141 C 972 150, 950 162, 924 178 Z" fill="url(#comet-tail)"/>
    <circle cx="1002" cy="132" r="4.5" fill="#ffe9b0"/>
    <circle cx="1002" cy="132" r="9" fill="#f5b731" opacity="0.35"/>
  </g>

  <!-- topic orbital -->
  <g>
    <circle cx="1148" cy="85" r="13" fill="none" stroke="#fb923c" stroke-opacity="0.8" stroke-width="1.3" stroke-dasharray="3 3"/>
    <circle cx="1148" cy="85" r="4" fill="#fb923c"/>
    <text x="1148" y="63" text-anchor="middle" font-size="10" fill="#fb923c" opacity="0.85" font-family="ui-monospace, 'SF Mono', Menlo, monospace">orders.created</text>
  </g>

  <!-- service capsules -->
  <g>
    <ellipse cx="778" cy="246" rx="90" ry="46" fill="url(#glow-cyan)"/>
    <rect x="712" y="228" width="132" height="36" rx="18" fill="#0d1526" stroke="#22d3ee" stroke-width="1.4"/>
