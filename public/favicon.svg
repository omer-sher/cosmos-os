<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e0b35"/>
      <stop offset="100%" stop-color="#07040f"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="star" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d0fe"/>
      <stop offset="50%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <clipPath id="clip">
      <circle cx="16" cy="16" r="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <!-- Background -->
    <rect width="32" height="32" fill="url(#bg)"/>

    <!-- Stars -->
    <circle cx="5"  cy="4"    r="0.65" fill="white" opacity="0.8"/>
    <circle cx="27" cy="5"    r="0.5"  fill="white" opacity="0.6"/>
    <circle cx="29" cy="26"   r="0.6"  fill="white" opacity="0.8"/>
    <circle cx="4"  cy="26"   r="0.5"  fill="white" opacity="0.6"/>
    <circle cx="15" cy="2.5"  r="0.4"  fill="white" opacity="0.5"/>
    <circle cx="30" cy="13"   r="0.4"  fill="white" opacity="0.5"/>
    <circle cx="2"  cy="16"   r="0.35" fill="white" opacity="0.4"/>
    <circle cx="20" cy="30.5" r="0.35" fill="white" opacity="0.4"/>

    <!-- Core glow -->
    <circle cx="16" cy="16" r="10" fill="url(#glow)"/>

    <!-- Orbital ring -->
    <ellipse cx="16" cy="16" rx="11.5" ry="4.6" fill="none" stroke="#a78bfa" stroke-opacity="0.55" stroke-width="1" transform="rotate(-24 16 16)"/>
    <circle cx="6.2" cy="19.6" r="1.1" fill="#22d3ee"/>

    <!-- Four-point sparkle star -->
    <path d="M16 7.5 C16.9 13 19 15.1 24.5 16 C19 16.9 16.9 19 16 24.5 C15.1 19 13 16.9 7.5 16 C13 15.1 15.1 13 16 7.5 Z" fill="url(#star)"/>
  </g>
</svg>
